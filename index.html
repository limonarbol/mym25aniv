<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f2efe5">
    <title>Nos emociona invitarte</title>
     <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🤍</text></svg>">
    <style>
      :root {
        color-scheme: light;
        --bone: #f2efe5;
        --ink: #292a23;
        --olive: #66705a;
        --clay: #857874;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        background-color: var(--bone);
        color: var(--ink);
        font-family: Georgia, "Times New Roman", serif;
      }

      main {
        width: min(100%, 48rem);
        padding: clamp(2rem, 8vw, 6rem) 1rem;
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 1.5rem;
        color: var(--olive);
        font-family: Arial, sans-serif;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 12ch;
        margin: 0 auto;
        font-size: clamp(3rem, 9vw, 6rem);
        font-weight: 400;
        line-height: 0.98;
      }

      .rule {
        width: 3rem;
        height: 1px;
        margin: 2rem auto 0;
        border: 0;
        background: var(--clay);
      }

      @media (max-width: 480px) {
        body {
          padding: 1.25rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Una celebración especial</p>
      <h1>Nos emociona invitarte</h1>
      <hr class="rule">
    </main>
  </body>
</html>
