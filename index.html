<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f2efe5">
    <title>M&M | Invitación</title>
    <style>
      :root {
        color-scheme: light;
        --bone: #f2efe5;
        --ink: #292a23;
        --olive: #66705a;
        --clay: #857874;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        background-color: var(--bone);
        color: var(--ink);
        font-family: Georgia, "Times New Roman", serif;
      }

      main {
        width: min(100%, 48rem);
        padding: clamp(2rem, 8vw, 6rem) 1rem;
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 1.5rem;
        color: var(--olive);
        font-family: Arial, sans-serif;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 12ch;
        margin: 0 auto;
        font-size: clamp(3rem, 9vw, 6rem);
        font-weight: 400;
        line-height: 0.98;
      }

      .rule {
        width: 3rem;
        height: 1px;
        margin: 2rem auto 0;
        border: 0;
        background: var(--clay);
      }

      @media (max-width: 480px) {
        body {
          padding: 1.25rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Porque a donde quiera que tú fueres, iré yo, y donde quiera que vivieres, viviré. Tu pueblo será mi pueblo, y tu Dios mi Dios.</p>
      <h1>¿Quieres venir a nuestra boda?</h1>
      <hr class="rule">
        <br>
        <!-- Este botón llama a la función de JavaScript al hacerle clic -->
        <button onclick="mostrarPregunta1()" style="padding: 10px 20px; font-size: 1rem; cursor: pointer;">
          Continuar
        </button>
      </div>

      <!-- PANTALLA 2: PRIMERA PREGUNTA (Oculta por defecto) -->
      <div id="pantalla-pregunta1" style="display: none;">
        <p class="eyebrow">Pregunta 1 de 4</p>
        <h2>¿Qué vas a traer como regalo de boda?</h2>
        <button style="display: block; margin: 10px auto; padding: 10px;">Dinero, obviamente</button>
        <button style="display: block; margin: 10px auto; padding: 10px;">Algo lindo de la lista</button>
      </div>
    </main>

    <!-- EL CEREBRO DE TU PÁGINA (JavaScript) -->
    <script>
      function mostrarPregunta1() {
        // Seleccionamos la portada y la ocultamos
        document.getElementById('pantalla-portada').style.display = 'none';
        
        // Seleccionamos la pregunta 1 y la hacemos visible
        document.getElementById('pantalla-pregunta1').style.display = 'block';
      }
    </script>
  </body>
</html>
